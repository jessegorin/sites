<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sites | Chowly Customer Success</title>
<meta name="description" content="Public one-page sites and customer-facing collateral.">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --heading-navy:   #0a2540;
    --text-muted:     #6b7a99;
    --text-subtle:    #8b95ad;
    --brand-blue:     #1B51A4;
    --accent-blue:    #3B82F6;
    --surface:        #ffffff;
    --border:         #e2e8f0;
    --page-bg:        linear-gradient(180deg, #ffffff 0%, #f8f9fc 45%, #f0f3fa 100%);
    --font-heading: Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --heading-navy: #eaf1ff;
      --text-muted:   #93a3c2;
      --text-subtle:  #7285a8;
      --brand-blue:   #7fb0ff;
      --accent-blue:  #7fb0ff;
      --surface:      #0a1428;
      --border:       #1e3157;
      --page-bg:      linear-gradient(180deg, #050b18 0%, #0a1428 60%, #0c1a33 100%);
    }
  }

  body {
    font-family: var(--font-body);
    background: var(--page-bg);
    color: var(--text-muted);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 640px; }

  .crumbs { margin: 0 0 22px; }

  .crumbs a {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-subtle);
    text-decoration: none;
    transition: color 200ms ease;
  }

  .crumbs a:hover { color: var(--brand-blue); }

  .crumbs a:focus-visible {
    outline: 2px solid var(--brand-blue);
    outline-offset: 3px;
    border-radius: 3px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin: 0 0 12px;
  }

  h1 {
    font-family: var(--font-heading);
    font-size: 2.1rem;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--heading-navy);
    margin: 0 0 10px;
  }

  .lede { margin: 0 0 34px; font-size: 1rem; }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }

  a.card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    text-decoration: none;
    transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
  }

  a.card:hover {
    transform: translateY(-2px);
    border-color: var(--brand-blue);
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
  }

  a.card:focus-visible { outline: 3px solid var(--brand-blue); outline-offset: 3px; }

  a.card h2 {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--heading-navy);
    margin: 0 0 5px;
  }

  a.card p { margin: 0; font-size: 14px; color: var(--text-muted); }

  footer { margin-top: 36px; font-size: 12px; color: var(--text-subtle); }

  @media (prefers-reduced-motion: reduce) {
    a.card, .crumbs a { transition: none; }
    a.card:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="https://jessegorin.github.io/">&larr; All work</a>
  </nav>
  <p class="eyebrow">Chowly Customer Success</p>
  <h1>Sites</h1>
  <p class="lede">Public one-page sites and customer-facing collateral.</p>

  <ul>
    <li>
      <a class="card" href="./google-search-ads/">
        <h2>Google Search Ads — What They Do for Your Restaurant</h2>
        <p>QBR one-pager: why Search Ads work, how campaigns are built, budget and measurement.</p>
      </a>
    </li>
  </ul>

  <footer>Maintained by Jesse Gorin · Chowly</footer>
</main>
</body>
</html>
